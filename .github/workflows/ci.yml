# ==============================================================================
# CI Pipeline Verification Workflow
# Origin: ISLab Pusan National University AI Engineering Researcher Evaluation
# Purpose: Ensures clean, safe, and reproducible CI/CD for ongoing development
# ==============================================================================

name: CI Pipeline Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Run Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run Pipeline Verification Suite
        run: |
          python test_pipeline.py
