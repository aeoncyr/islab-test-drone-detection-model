# ============================================================
# docker-compose.yml — Drone Detector Orchestration
# ============================================================
# Services:
#   train     : Train the best model (Model-D)
#   train-ddp : Multi-GPU DistributedDataParallel training
#   evaluate  : Run evaluation and compute mAP metrics
#   infer     : Run visual bounding box inference on an image
#   benchmark : Run master benchmark suite against all models
#
# Usage:
#   # Build container image
#   docker compose build
#
#   # Train best model (Model-D)
#   docker compose run --rm train
#
#   # Multi-GPU DDP training (e.g. 2 GPUs)
#   docker compose run --rm train-ddp
#
#   # Evaluate Model-D checkpoint
#   docker compose run --rm evaluate
#
#   # Run visual detection on test image
#   docker compose run --rm infer
# ============================================================

version: "3.9"

x-base-service: &base-service
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: vanilla-drone-detector:latest
  volumes:
    # Mount source code (hot-reload edits without rebuilding)
    - ..:/workspace
    # Mount dataset (read-only)
    - ../datasets:/workspace/datasets:ro
    # Persist run checkpoints, logs, and plots
    - ../runs:/workspace/runs
  environment:
    - WANDB_API_KEY=${WANDB_API_KEY:-}   # Pass W&B key from host if available
    - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  # 1. Standard Single-GPU Training (Model-D Best Architecture)
  train:
    <<: *base-service
    command: >
      python train.py
      --config configs/model_d_p2_ema.yaml

  # 2. Multi-GPU DistributedDataParallel (DDP) Training
  train-ddp:
    <<: *base-service
    command: >
      python -m torch.distributed.run
      --nproc_per_node=2
      --master_port=29500
      train.py
      --config configs/model_d_p2_ema.yaml

  # 3. Model Evaluation Service
  evaluate:
    <<: *base-service
    command: >
      python evaluate.py
      --config configs/model_d_p2_ema.yaml
      --checkpoint runs/model_d_p2_ema/best.pth

  # 4. Visual Inference Service
  infer:
    <<: *base-service
    command: >
      python infer.py
      --config configs/model_d_p2_ema.yaml
      --checkpoint runs/model_d_p2_ema/best.pth
      --image datasets/sample/augmented_raw_dataset_city_foggy_city_foggy_0_1_sequence.4_step0.camera.png
      --output runs/detection_result.jpg

  # 5. Master Benchmark & Comparison Table Generation
  benchmark:
    <<: *base-service
    command: >
      python benchmark.py

